  detail: >-
    Ainos Technology sells AI vision-screening systems to Chinese education bureaus, CDCs and eye
    hospitals, and its entire public surface is the eyenurse.net Vue single-page marketing site
    (products, solutions, cases, news, app downloads, a trial-request form and a customer login) whose
    shipped router — read straight out of https://eyenurse.net/js/app.3829f574.js — contains no
    developer, open-platform or documentation route at all, and whose 49 JavaScript chunks contain zero
    occurrences of 接口, 开发者 or 开放平台 (the 14 hits for 对接 are all about pairing the AI
    data-transfer module with 130+ third-party ophthalmic instruments, not about an API). The one API
    host the company operates, api.eyenurse.net, is the site's own Spring Boot backend: its root serves
    the stock nginx welcome page and /newdeparture/v2/api-docs, /v3/api-docs, /doc.html,
    /swagger-ui.html and /swagger-resources all return Spring 404 JSON, so no contract is published
    there either. Every 200 on www.eyenurse.net is a soft 404 — a control probe of
    /zz-api-evangelist-control-9f3a returns the same 8,071-byte SPA shell as /openapi.json, /graphql
    and /.well-known/agent-card.json — and docs./developer./open./portal.eyenurse.net exist only via a
    wildcard A record with no matching TLS certificate.
